<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drei Ethik-Schulen im Vergleich</title>
<style>
  body{margin:0;padding:20px;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#333;box-sizing:border-box;}
  .container{max-width:820px;margin:0 auto;}
  .lead{font-size:.95rem;margin:0 0 12px;color:#555;}
  .dilemmas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .dilemmas button{background:#eee;color:#333;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.15s;}
  .dilemmas button:hover{background:#e0e0e0;}
  .dilemmas button.active{background:#ff6a00;color:#fff;}
  .scenario{font-size:.95rem;font-weight:600;background:#fff7f0;border-left:4px solid #ff6a00;padding:12px 14px;border-radius:4px;margin-bottom:18px;}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .card{border:1px solid #e3e3e3;border-radius:8px;padding:14px;background:#fff;}
  .card h3{margin:0 0 4px;font-size:.95rem;color:#ff6a00;}
  .card .crit{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#999;margin-bottom:8px;}
  .verdict{font-weight:700;font-size:.9rem;margin-bottom:6px;}
  .yes{color:#1a8a3c;}.no{color:#c0392b;}.dep{color:#b8860b;}
  .card p{margin:0;font-size:.82rem;line-height:1.4;color:#444;}
  @media(max-width:640px){.cols{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="container">
  <p class="lead">Wählen Sie ein Sicherheits-Dilemma — und sehen Sie, wie die drei Denkschulen es bewerten.</p>
  <div class="dilemmas" id="dilemmas"></div>
  <div class="scenario" id="scenario"></div>
  <div class="cols">
    <div class="card"><h3>Tugendethik</h3><div class="crit">Maßstab: Intention / Charakter</div><div class="verdict" id="v0"></div><p id="t0"></p></div>
    <div class="card"><h3>Utilitarismus</h3><div class="crit">Maßstab: Folgen / Nutzen</div><div class="verdict" id="v1"></div><p id="t1"></p></div>
    <div class="card"><h3>Pflichtenethik (Kant)</h3><div class="crit">Maßstab: Verallgemeinerbare Pflicht</div><div class="verdict" id="v2"></div><p id="t2"></p></div>
  </div>
</div>
<script>
const D=[
 {label:"Zero-Day offenlegen",
  scn:"Sie entdecken eine kritische Zero-Day-Schwachstelle. Sofort öffentlich machen — oder erst dem Hersteller Zeit zum Patchen geben?",
  s:[["dep","Kommt auf die Haltung an","Tugendhaft ist verantwortungsbewusstes Handeln: Schutz der Nutzer als Tugend spricht für koordinierte Offenlegung, nicht für Effekthascherei."],
     ["yes","Eher offenlegen (koordiniert)","Größter Gesamtnutzen entsteht meist durch Responsible Disclosure: Hersteller patcht, bevor Angreifer die Lücke ausnutzen können."],
     ["no","Nicht ungeschützt offenlegen","Eine sofortige Veröffentlichung instrumentalisiert die gefährdeten Nutzer als Mittel. Pflicht: niemanden vermeidbarem Schaden aussetzen."]]},
 {label:"Beschäftigte überwachen",
  scn:"Zur Abwehr von Insider-Angriffen soll eine KI alle Mitarbeiter-Logs dauerhaft auswerten. Einführen?",
  s:[["no","Eher nein","Lückenlose Überwachung untergräbt Vertrauen und das Maß — eine tugendhafte Sicherheitskultur setzt auf Verhältnismäßigkeit, nicht auf Misstrauen."],
     ["dep","Nur wenn Nutzen > Schaden","Zulässig, wenn der Sicherheitsgewinn die Belastung der Beschäftigten klar überwiegt — sonst überwiegt der kollektive Schaden (Chilling Effect)."],
     ["no","Nein, so nicht","Totalüberwachung behandelt alle als Verdächtige und damit als bloßes Mittel. Datenminimierung als Pflicht."]]},
 {label:"Backdoor für Behörden",
  scn:"Der Gesetzgeber verlangt eine Hintertür in Ihrer Verschlüsselung für die Strafverfolgung. Einbauen?",
  s:[["no","Eher nein","Integrität und Aufrichtigkeit gegenüber den Nutzern sind Tugenden — eine versteckte Schwächung widerspricht der professionellen Haltung."],
     ["no","Nein","Eine Backdoor schwächt die Sicherheit aller und wird absehbar missbraucht — der erwartbare Gesamtschaden überwiegt den Ermittlungsnutzen."],
     ["no","Nein","Eine für alle verallgemeinerte Hintertür ist nicht widerspruchsfrei wollbar: Sicherheit, die jeder umgehen kann, hebt sich selbst auf."]]}
];
const dc=document.getElementById('dilemmas');
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.label;b.onclick=()=>pick(i);dc.appendChild(b);});
function pick(i){
 [...dc.children].forEach((b,j)=>b.classList.toggle('active',j===i));
 const d=D[i];document.getElementById('scenario').textContent=d.scn;
 d.s.forEach((row,k)=>{const v=document.getElementById('v'+k);v.textContent=row[1];v.className='verdict '+row[0];document.getElementById('t'+k).textContent=row[2];});
}
pick(0);
</script>
</body>
</html>
