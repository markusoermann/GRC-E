<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIS2/BSIG-Einrichtungs-Klassifikator</title>
<style>
  :root { --orange: #ff6a00; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #fff; color: #333; }
  .container { max-width: 640px; margin: 0 auto; }
  h3 { text-align: center; margin: 0 0 4px; color: #444; }
  .sub { text-align: center; font-size: 0.85rem; color: #888; margin-bottom: 18px; }

  .panel { background: #f9f9f9; border: 2px solid #eee; border-radius: 10px; padding: 18px; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin: 12px 0 5px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; padding: 10px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; font-family: inherit; background: #fff; }
  input:focus, select:focus { outline: none; border-color: var(--orange); }
  .hint { font-size: 0.78rem; color: #999; margin-top: 3px; }

  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 0.9rem; }
  .check input { width: auto; }

  button.go { width: 100%; margin-top: 18px; background: var(--orange); border: none; color: #fff; padding: 13px; border-radius: 6px; font-weight: 700; font-size: 1.02rem; cursor: pointer; transition: filter .2s; }
  button.go:hover { filter: brightness(1.08); }

  .result { display: none; margin-top: 18px; border-radius: 8px; padding: 16px; animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .result.bwe { background: #fff0e6; border: 2px solid var(--orange); }
  .result.we  { background: #fff7ec; border: 2px solid #ffb74d; }
  .result.no  { background: #eef6ee; border: 2px solid #81c784; }
  .badge { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; }
  .result.bwe .badge { color: #c43e00; }
  .result.we  .badge { color: #b86a00; }
  .result.no  .badge { color: #2e7d32; }
  .reason { font-size: 0.9rem; line-height: 1.5; color: #444; }
  .duties { margin: 12px 0 0; padding-left: 20px; font-size: 0.88rem; line-height: 1.55; color: #333; }
  .legal { font-size: 0.76rem; color: #888; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h3>Bin ich eine NIS2-Einrichtung?</h3>
  <div class="sub">Größenklassifikation nach NIS2-RL / BSIG (§ 28 BSIG)</div>

  <div class="panel">
    <label for="emp">Beschäftigte (Vollzeitäquivalente)</label>
    <input id="emp" type="number" min="0" placeholder="z. B. 180">

    <label for="rev">Jahresumsatz in Mio. €</label>
    <input id="rev" type="number" min="0" step="0.1" placeholder="z. B. 35">
    <div class="hint">Bei „besonders wichtig" zählt zusätzlich die Bilanzsumme &gt; 43 Mio. €.</div>

    <label for="sektor">Sektor (Anlage 1/2 BSIG)</label>
    <select id="sektor">
      <option value="erfasst">In einem erfassten Sektor tätig</option>
      <option value="kritis">Betreiber einer kritischen Anlage nach KRITIS-DachG</option>
      <option value="nein">Kein erfasster Sektor</option>
    </select>

    <div class="check">
      <input id="bilanz" type="checkbox">
      <label for="bilanz" style="margin:0;font-weight:500;">Bilanzsumme übersteigt 43 Mio. € (für „besonders wichtig" relevant)</label>
    </div>

    <button class="go" onclick="classify()">Klassifizieren</button>

    <div id="result" class="result">
      <div id="badge" class="badge"></div>
      <div id="reason" class="reason"></div>
      <ul id="duties" class="duties"></ul>
      <div id="legal" class="legal"></div>
    </div>
  </div>
</div>

<script>
function classify() {
  const emp = parseInt(document.getElementById('emp').value, 10);
  const rev = parseFloat(document.getElementById('rev').value);
  const sektor = document.getElementById('sektor').value;
  const bilanz = document.getElementById('bilanz').checked;

  const box = document.getElementById('result');
  const badge = document.getElementById('badge');
  const reason = document.getElementById('reason');
  const duties = document.getElementById('duties');
  const legal = document.getElementById('legal');
  duties.innerHTML = '';

  if (isNaN(emp) || isNaN(rev)) {
    box.style.display = 'block';
    box.className = 'result we';
    badge.textContent = 'Bitte Beschäftigtenzahl und Umsatz eingeben.';
    reason.textContent = '';
    legal.textContent = '';
    return;
  }

  const baseDuties = [
    'Registrierung beim BSI (§§ 33, 34 BSIG)',
    'Risikomanagementmaßnahmen nach Stand der Technik (§ 30 BSIG)',
    'Meldepflicht: Erstmeldung innerhalb 24 h, Detailmeldung 72 h, Abschlussmeldung 1 Monat (§ 32 BSIG)',
    'Unterrichtung von Kunden/Öffentlichkeit bei erheblichen Vorfällen (§§ 35, 36 BSIG)'
  ];

  // KRITIS-Betreiber sind stets besonders wichtige Einrichtungen
  const isKritis = (sektor === 'kritis');
  const bweSize = (emp > 250) || (rev > 50 && bilanz);
  const weSize  = (emp > 50) && (rev > 10);

  if (sektor === 'nein') {
    box.className = 'result no';
    badge.textContent = '✅ Voraussichtlich nicht erfasst';
    reason.textContent = 'Ohne Tätigkeit in einem der erfassten Sektoren (Anlage 1/2 BSIG) greifen die NIS2-Pflichten grundsätzlich nicht. Sektorzuordnung im Zweifel über die NIS2-Betroffenheitsprüfung des BSI verifizieren.';
    legal.textContent = '§ 28 BSIG · Anlage 1/2 BSIG';
    box.style.display = 'block';
    return;
  }

  if (isKritis || bweSize) {
    box.className = 'result bwe';
    badge.textContent = '🔶 Besonders wichtige Einrichtung';
    reason.textContent = isKritis
      ? 'Betreiber kritischer Anlagen nach KRITIS-DachG sind stets besonders wichtige Einrichtungen.'
      : 'Schwelle erreicht: > 250 Beschäftigte oder > 50 Mio. € Umsatz und > 43 Mio. € Bilanzsumme (§ 28 Abs. 1 BSIG).';
    baseDuties.concat(['Proaktiver Nachweis der Risikomanagementmaßnahmen (§ 39 BSIG)',
      'Anlasslose Aufsicht durch das BSI möglich (§ 61 BSIG)'])
      .forEach(d => { const li = document.createElement('li'); li.textContent = d; duties.appendChild(li); });
    legal.textContent = '§ 28 Abs. 1 BSIG · Geschäftsleiterhaftung § 38 BSIG · Bußgeld bis 10 Mio. € / 2 % (§ 65 BSIG)';
  } else if (weSize) {
    box.className = 'result we';
    badge.textContent = '🟠 Wichtige Einrichtung';
    reason.textContent = 'Schwelle erreicht: > 50 Beschäftigte und > 10 Mio. € Umsatz und Bilanzsumme (§ 28 Abs. 2 BSIG). Aufsicht durch das BSI nur bei Hinweisen auf Verstöße.';
    baseDuties.forEach(d => { const li = document.createElement('li'); li.textContent = d; duties.appendChild(li); });
    legal.textContent = '§ 28 Abs. 2 BSIG · Aufsicht anlassbezogen § 62 BSIG · Bußgeld bis 7 Mio. € / 1,4 % (§ 65 BSIG)';
  } else {
    box.className = 'result no';
    badge.textContent = '✅ Voraussichtlich nicht erfasst';
    reason.textContent = 'Die Größenschwellen werden nicht erreicht (Kleinst-/Kleinunternehmen). Achtung: Bestimmte Einrichtungen sind unabhängig von der Größe erfasst (z. B. qualifizierte Vertrauensdiensteanbieter, TLD-Registries, öffentliche Verwaltung). Im Zweifel die NIS2-Betroffenheitsprüfung des BSI nutzen.';
    legal.textContent = '§ 28 BSIG';
  }
  box.style.display = 'block';
}
</script>
</body>
</html>
